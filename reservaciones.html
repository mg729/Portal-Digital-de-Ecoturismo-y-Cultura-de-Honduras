<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservaciones</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon">
</head>

<body>
    <header class="navbar">
        <div class="navbar__logo__area">
            <img class="logo" src="./img/logo.png" alt="logo">
            <h1><a href="index.html">EcoHonduras</a></h1>
        </div>
        <!--Menu de Navegacion-->
        <nav>
            <ul class="navbar__lista">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="destinos.html">Destinos y Rutas Turisticas</a></li>
                <li><a href="cultura.html">Cultura, Patrimonio y Gastronomia Nacional</a></li>
                <li><a href="reservaciones.html"> Reservaciones y Solicitud de Tours</a></li>
                <li><a href="contacto.html">Contacto y Asistencia al Turista</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form class="formulario" action="" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>1. Datos Personales</legend>
                <div class="campo">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Coloque su nombre completo">
                </div>
                <div class="campo">
                    <label for="Telefono">Telefono</label>
                    <input type="text" name="Telefono" id="Telefono" placeholder="Coloque su numero de Telefono"
                        required pattern="/^\+?[0-9]{1,3}?[-\s]?([0-9]{2,4}[-\s]?){2,3}[0-9]{2,4}$/">
                </div>
                <div class="campo">
                    <label for="Correo">Correo</label>
                    <input type="email" name="Correo" id="Correo" placeholder="Coloque su Correo" required>
                </div>
            </fieldset>
            <fieldset>
                <legend>2. Datos del Destino</legend>
                <div class="campo">
                    <label for="">Seleccion del circuito</label>
                    <select name="" id="" required>
                        <option value="">--Seleccione el circuito-- </option>
                        <option value="">Ruta Maya y Arqueología: Copán Ruinas</option>
                        <option value="">Ecoturismo y Bosques Nublados: Parque Nacional La Tigra</option>
                        <option value="">Caribe y Arrecifes: Roatán, Islas de la Bahía</option>
                    </select>
                </div>
            </fieldset>
            <fieldset>
                <legend>3. Acompañantes</legend>
                <div class="campo">
                    <label for="">Adultos mayores</label>
                    <input type="number" name="" id="" min="0" max="15" placeholder="0">
                </div>
                <div class="campo">
                    <label for="">Menores de edad</label>
                    <input type="number" name="" id="" min="0" max="15" placeholder="0">
                </div>
                <div class="campo">
                    <label for="guia-bilingue">
                        <input type="checkbox" name="" id=""> Guia bilingue
                    </label>
                </div>
                <div class="campo">
                    <label for="guia-bilingue">
                        <input type="checkbox" name="" id=""> Necesidades de accesibilidad
                    </label>
                </div>
            </fieldset>
            <fieldset>
                <legend>4. Terminos y condiciones</legend>
                <div class="campo">
                    <label for="">
                        <input type="checkbox" name="terminos" id="terminos" required>
                        Acepto los terminos
                    </label>
                </div>
            </fieldset>
            <div class="form-action">
                <button type="submit" class="btn">Enviar</button>
            </div>
        </form>
    </main>
</body>

</html>
